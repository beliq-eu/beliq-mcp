name: Release

# Publishes beliq-mcp to npm via Trusted Publishing (OIDC) - no NPM_TOKEN
# needed. Provenance attestations are generated automatically. Trigger by
# pushing a version tag (e.g. v0.1.1) or running the workflow manually.
#
# Prerequisite: @beliq/sdk must already be on npm, since this package depends on
# it and CI resolves it from the registry.
#
# One-time setup on npmjs.com: configure beliq-eu/beliq-mcp as a Trusted
# Publisher for the beliq-mcp package (package Settings -> Publishing access ->
# GitHub Actions, workflow `release.yml`, environment `release`). The first
# v0.1.0 release is bootstrapped with a local `npm publish`; every tag from then
# on flows through here with provenance.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# One release at a time, never cancelled midway: two tags pushed together would
# otherwise publish in parallel and finish in either order. GitHub keeps one
# waiting run per group, so a third tag cancels the waiting one; re-run it.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest # Trusted Publishing requires a cloud-hosted runner
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # required for npm Trusted Publishing (OIDC)
    # The half an edit to this file cannot remove. GitHub refuses to start the
    # job unless the ref matches this environment's `v*.*.*` tag policy, and
    # npm only accepts a Trusted Publishing token from a run in it.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the guard below needs main's history

      # workflow_dispatch offers every branch, and a tag can point at any commit.
      # This stops a release from the wrong place by mistake. It is no defence
      # against an edit to this file: a tag runs the workflow as of its commit.
      # The `release` environment above is that defence.
      - name: Release only from a vX.Y.Z tag on main
        run: |
          if ! [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::a release runs from a vX.Y.Z tag, not from $GITHUB_REF"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $(git rev-parse --short HEAD), which is not on main"
            exit 1
          fi

      # No `registry-url`: it writes an `.npmrc` with a token placeholder that
      # npm would use instead of OIDC, so publish would fail with a 404. npm
      # defaults to registry.npmjs.org and uses Trusted Publishing when the
      # token-auth `.npmrc` is absent.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          # No dependency cache in a publishing job: a poisoned cache would ship.
          package-manager-cache: false

      # Trusted Publishing + automatic provenance need npm >= 11.5.1. Pinned, not
      # @latest, so a new npm release reaches a publish only through a reviewed bump.
      - name: Upgrade npm
        # renovate: datasource=npm depName=npm
        run: npm install -g npm@12.2.2

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # server.json names the npm version the registry job lists, so it has to
      # match before npm holds a version that cannot be listed. manifest.json
      # names the version of the bundle the bundle job attaches.
      - name: package.json and server.json versions match the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          for field in "package.json .version" "server.json .version" "server.json .packages[0].version" "manifest.json .version"; do
            have="$(jq -r "${field#* }" "${field%% *}")"
            test "$want" = "$have" || {
              echo "tag says $want, $field says $have"
              exit 1
            }
          done

      - name: Publish to npm
        run: npm publish

  # Lists the version just published in the MCP Registry, under the name in
  # server.json, which the registry checks against `mcpName` in the npm
  # package. A job of its own, so a failed listing re-runs alone: a re-run of
  # `publish` fails on the version npm already holds.
  registry:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The same tag policy as `publish`, so only a release tag can mint the
    # OIDC token that publishes under io.github.beliq-eu.
    environment: release
    permissions:
      contents: read
      id-token: write # mcp-publisher login github-oidc
    env:
      # renovate: datasource=github-releases depName=modelcontextprotocol/registry
      MCP_PUBLISHER_VERSION: 1.8.9
      # The mcp-publisher_linux_amd64.tar.gz line of registry_<version>_checksums.txt
      # in that release. It moves with the version, in the same commit.
      MCP_PUBLISHER_SHA256: 4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Is this version listed already
        id: listed
        run: |
          name="$(jq -r .name server.json)"
          version="${GITHUB_REF_NAME#v}"
          url="https://registry.modelcontextprotocol.io/v0/servers/$(jq -rn --arg s "$name" '$s|@uri')/versions/$version"
          code="$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --max-time 30 "$url")"
          case "$code" in
            200) echo "listed=true" >> "$GITHUB_OUTPUT"; echo "$name $version is listed already" ;;
            404) echo "listed=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::the registry answered $code for $url"; exit 1 ;;
          esac

      - name: Download mcp-publisher
        if: steps.listed.outputs.listed == 'false'
        run: |
          archive=mcp-publisher_linux_amd64.tar.gz
          curl -fsSL --retry 3 --max-time 120 -o "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/$archive"
          echo "${MCP_PUBLISHER_SHA256}  $archive" | sha256sum -c -
          tar xzf "$archive" mcp-publisher
          rm "$archive"

      # npm can take minutes to serve a new version, and the registry answers
      # that publish with a 404 and "wait and retry". Only that answer is
      # retried; a failed login fails the step. Each try logs in again, so a
      # registry token never outlives a wait.
      - name: Publish to the MCP Registry
        if: steps.listed.outputs.listed == 'false'
        run: |
          deadline=$((SECONDS + 600))
          while true; do
            ./mcp-publisher login github-oidc
            if out="$(./mcp-publisher publish 2>&1)"; then
              echo "$out"
              break
            fi
            echo "$out"
            if ! grep -qE 'status: 404|retry later' <<<"$out" || [ "$SECONDS" -ge "$deadline" ]; then
              exit 1
            fi
            sleep 30
          done

  # Packs the MCPB bundle for Claude Desktop and other MCPB clients, and
  # attaches it to the tag's GitHub Release. After `publish`, so a bundle only
  # exists for a version npm holds, and its version check has passed.
  bundle:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the GitHub Release and upload the bundle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          # No dependency cache in a publishing job: a poisoned cache would ship.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack and start the bundle
        run: |
          file="beliq-mcp-${GITHUB_REF_NAME#v}.mcpb"
          scripts/pack-mcpb.sh "$file"
          dir="$(mktemp -d)"
          unzip -q "$file" -d "$dir"
          node scripts/smoke-mcpb.mjs "$dir"

      # A re-run finds the release it created and replaces the bundle on it.
      - name: Attach the bundle to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          file="beliq-mcp-${GITHUB_REF_NAME#v}.mcpb"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$file" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$file" --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes "Changes: CHANGELOG.md. $file is the MCPB bundle for Claude Desktop and other MCPB clients."
          fi
